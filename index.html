<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lioninside Kids Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════ LOGIN SCREEN ═══════════════ -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="login-logo">🎵</div>
      <h1 class="login-title">Lioninside<br>Kids Player</h1>
      <p class="login-sub">Safe music for happy kids</p>
      <button id="login-btn" class="btn-spotify">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Connect with Spotify
      </button>
      <p class="login-note">Requires Spotify Premium</p>
    </div>
  </div>

  <!-- ═══════════════ PLAYER SCREEN ═══════════════ -->
  <div id="player-screen" class="screen hidden">

    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <span class="logo-icon">🎵</span>
        <span class="logo-text">Lioninside Kids Player</span>
      </div>
      <div class="header-right">
        <span id="user-name" class="user-name"></span>
        <button id="reconnect-btn" class="btn-reconnect" title="Reconnect Spotify">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          Connect Spotify
        </button>
      </div>
    </header>

    <main class="app-main">

      <!-- ─── LEFT: PLAYER ─── -->
      <section class="player-section">

        <!-- Turntable -->
        <div class="turntable-wrapper">
          <div class="turntable-base">

            <!-- Vinyl record -->
            <div class="vinyl-container">
              <div class="vinyl" id="vinyl">
                <img id="vinyl-art" src="" alt="Album Art" class="vinyl-art">
                <div class="vinyl-hole"></div>
              </div>
            </div>

          </div><!-- /turntable-base -->
        </div><!-- /turntable-wrapper -->

        <!-- Track info -->
        <div class="track-info">
          <h2 id="track-name" class="track-name">No track playing</h2>
          <p id="artist-name" class="artist-name">Connect to start listening</p>
          <button id="now-playing-fav-btn" class="btn-now-playing-fav hidden" title="Add to favorites">🤍</button>
        </div>

        <!-- Progress bar -->
        <div class="progress-wrapper">
          <span id="current-time" class="time-label">0:00</span>
          <input type="range" id="progress-slider" class="slider" value="0" min="0" max="100" step="0.1">
          <span id="total-time" class="time-label">0:00</span>
        </div>

        <!-- Playback controls -->
        <div class="controls">
          <button id="prev-btn" class="ctrl-btn" title="Previous">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>
          <button id="play-pause-btn" class="ctrl-btn ctrl-btn--main" title="Play / Pause">
            <!-- Play icon -->
            <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Pause icon (hidden by default) -->
            <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="hidden">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>
          <button id="next-btn" class="ctrl-btn" title="Next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zm2-8.14 5.27 3.64v.5L8 9.86zm8.5-3.86v12H18V6h-1.5z"/>
            </svg>
          </button>
        </div>

        <!-- Volume -->
        <div class="volume-wrapper">
          <button id="mute-btn" class="icon-btn" title="Toggle mute">
            <svg id="icon-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" class="slider volume-slider" value="80" min="0" max="100">
        </div>

      </section><!-- /player-section -->

      <!-- ─── RIGHT: PANEL ─── -->
      <section class="panel-section">

        <div class="panel-tabs">
          <button class="tab-btn active" data-tab="search">🔍 Search</button>
          <button class="tab-btn" data-tab="favorites">❤️ Favorites</button>
          <button class="tab-btn" data-tab="album">💿 Album</button>
        </div>

        <!-- Search Tab -->
        <div id="tab-search" class="tab-content active">
          <div class="search-bar">
            <div class="search-input-wrap">
              <input type="text" id="search-input" class="search-input"
                     placeholder="Search for a song…" autocomplete="off" spellcheck="false">
              <button id="clear-search-btn" class="btn-clear-search hidden" title="Clear">✕</button>
            </div>
            <button id="search-btn" class="btn-search">Search</button>
          </div>
          <div id="search-error" class="search-error hidden"></div>
          <div id="search-results" class="track-list"></div>
        </div>

        <!-- Favorites Tab -->
        <div id="tab-favorites" class="tab-content hidden">
          <div class="tab-header">
            <span>Your Spotify Favorites</span>
            <button id="refresh-favs-btn" class="btn-icon-small" title="Refresh">↺</button>
          </div>
          <div id="favorites-list" class="track-list"></div>
          <div class="load-more-wrapper">
            <button id="load-more-favs-btn" class="btn-load-more hidden">Load more</button>
          </div>
        </div>

        <!-- Album Tab -->
        <div id="tab-album" class="tab-content hidden">
          <div id="album-header" class="album-header"></div>
          <div id="album-tracks" class="track-list"></div>
        </div>

      </section><!-- /panel-section -->

    </main>
  </div><!-- /player-screen -->

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <!-- App scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
